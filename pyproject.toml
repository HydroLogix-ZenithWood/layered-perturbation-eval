[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "layered-perturbation-eval"
version = "0.2.1"
description = "Identity-safe measured-response and perturbation-evidence evaluation research toolkit"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "scipy>=1.10", "pandas>=2.0", "scikit-learn>=1.3"]

[project.scripts]
layered-eval = "layered_eval.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
